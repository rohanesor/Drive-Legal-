<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveLegal - Release History</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #070d19;
            --card-bg: #0f172a;
            --accent-cyan: #00e5ff;
            --accent-blue: #2563eb;
            --text-primary: #ffffff;
            --text-secondary: #a3a3a3;
            --border-color: rgba(255, 255, 255, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 2rem;
            transition: var(--transition);
        }

        .back-link:hover {
            opacity: 0.8;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3rem;
            overflow-x: auto;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            margin-bottom: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th {
            color: var(--text-secondary);
            font-weight: 600;
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
        }

        td {
            padding: 1.25rem 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-success {
            background-color: rgba(0, 230, 118, 0.1);
            color: #00e676;
            border: 1px solid rgba(0, 230, 118, 0.2);
        }

        .badge-pending {
            background-color: rgba(255, 214, 0, 0.1);
            color: #ffd600;
            border: 1px solid rgba(255, 214, 0, 0.2);
        }

        .download-link {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
        }

        .download-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/download" class="back-link">← Back to Portal</a>

        <div class="card">
            <h1>Version Release History</h1>

            <table id="releases-table">
                <thead>
                    <tr>
                        <th>Version</th>
                        <th>Build</th>
                        <th>Release Date</th>
                        <th>Android</th>
                        <th>iOS</th>
                        <th>Android Auto</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="releases-body">
                    <!-- Dynamic Rows Loaded Here -->
                    <tr>
                        <td colspan="7" style="text-align: center; color: var(--text-secondary);">Loading release history...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        fetch('/releases/history.json')
            .then(res => res.json())
            .then(data => {
                const body = document.getElementById('releases-body');
                body.innerHTML = '';
                
                data.forEach(rel => {
                    const tr = document.createElement('tr');
                    
                    const versionTd = document.createElement('td');
                    versionTd.innerHTML = `<strong>v${rel.version}</strong>`;
                    
                    const buildTd = document.createElement('td');
                    buildTd.innerText = rel.build;
                    
                    const dateTd = document.createElement('td');
                    dateTd.innerText = rel.releaseDate;
                    
                    const androidTd = document.createElement('td');
                    androidTd.innerHTML = rel.android.apk ? `<a href="${rel.android.apk}" class="download-link">Available</a>` : 'N/A';
                    
                    const iosTd = document.createElement('td');
                    iosTd.innerText = rel.ios.appStore ? 'App Store' : (rel.ios.testflight ? 'TestFlight' : 'N/A');
                    
                    const autoTd = document.createElement('td');
                    autoTd.innerText = rel.androidAuto.supported ? 'Supported' : 'No';
                    
                    const statusTd = document.createElement('td');
                    statusTd.innerHTML = `<span class="badge badge-success">Released</span>`;
                    
                    tr.appendChild(versionTd);
                    tr.appendChild(buildTd);
                    tr.appendChild(dateTd);
                    tr.appendChild(androidTd);
                    tr.appendChild(iosTd);
                    tr.appendChild(autoTd);
                    tr.appendChild(statusTd);
                    
                    body.appendChild(tr);
                });
            })
            .catch(err => {
                console.error("Error loading release history:", err);
                const body = document.getElementById('releases-body');
                body.innerHTML = `
                    <tr>
                        <td><strong>v1.0.0</strong></td>
                        <td>100</td>
                        <td>2026-08-16</td>
                        <td><a href="/download/files/DriveLegal-v1.0.0.apk" class="download-link">Available</a></td>
                        <td>App Store</td>
                        <td>Supported</td>
                        <td><span class="badge badge-success">Released</span></td>
                    </tr>
                `;
            });
    </script>
</body>
</html>
