version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DRIVELEGAL_ENV=PRODUCTION
      - DATABASE_URL=postgresql://drivelegal_user:${DB_PASSWORD}@db:5432/drivelegal_sync
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=drivelegal_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=drivelegal_sync
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: always

volumes:
  postgres_data:
  redis_data:
