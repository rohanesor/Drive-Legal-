<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#131C31"/>
    </linearGradient>

    <!-- Arrow Mint Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFC2"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Road Beam Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Cockpit Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Border Rim -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2A3B5C" stroke-width="4" opacity="0.6"/>

  <!-- 3D Perspective Road Track Corridor -->
  <polygon points="128,430 384,430 310,210 202,210" fill="#1D2A47" opacity="0.7"/>

  <!-- 3D Glowing Curvature Projection Beam -->
  <path d="M 256,410 L 256,230 L 320,130" stroke="#00E5FF" stroke-width="20" stroke-linecap="round" fill="none" filter="url(#cyanGlow)" opacity="0.85"/>

  <!-- Master Vazhi Navigation Avatar (Sleek Directional Arrow) -->
  <path d="M 256,105 L 376,365 L 256,310 L 136,365 Z" fill="url(#mintGrad)" filter="url(#cyanGlow)"/>

  <!-- Inner Chevron Detail Accent -->
  <path d="M 256,165 L 326,325 L 256,290 L 186,325 Z" fill="#0A0F1D" opacity="0.4"/>
</svg>
