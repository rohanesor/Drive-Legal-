/**
 * Android app module build configuration for Vazhi
 */
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// React Native autolinking - generates PackageList.java and adds native module dependencies
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

project.ext.react = [
    root: "../../",
    entryFile: "../../index.js",
]

react {
    root = file("../../")
    entryFile = file("../../index.js")
}

def enableProguardInReleaseBuilds = true

if (System.getenv("SENTRY_AUTH_TOKEN") != null && project.findProperty("sentry.autoUpload") != "false") {
    apply from: new File(["node", "--print", "require.resolve('@sentry/react-native/package.json')"].execute().text.trim(), "../sentry.gradle")
}
android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.vazhi"
    defaultConfig {
        applicationId "com.vazhi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    splits {
        abi {
            enable false
            reset()
            include "arm64-v8a"
            universalApk false
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def keystorePropsFile = file('../release-keystore.properties')
            if (keystorePropsFile.exists()) {
                def keystoreProps = new Properties()
                keystorePropsFile.withInputStream { keystoreProps.load(it) }
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            } else if (System.getenv("PLAY_STORE_KEYSTORE_FILE") != null) {
                storeFile file(System.getenv("PLAY_STORE_KEYSTORE_FILE"))
                storePassword System.getenv("PLAY_STORE_KEY_PASSWORD")
                keyAlias System.getenv("PLAY_STORE_KEY_ALIAS")
                keyPassword System.getenv("PLAY_STORE_KEY_PASSWORD")
            } else {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.debug
        }
    }

}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("com.google.android.gms:play-services-location:21.0.1")
    implementation("androidx.car.app:app:1.4.0-rc01")
    debugImplementation("com.facebook.react:flipper-integration")
}
