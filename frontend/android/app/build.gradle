/**
 * Android app module build configuration
 * 
 * Key configurations:
 * - Applies Chaquopy plugin to embed Python runtime in the Android app
 * - Configures Python packages (faiss, onnxruntime, pywhispercpp)
 * - Sets up React Native autolinking
 * - Enables large heap for ML model memory requirements
 */
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.chaquo.python"

// React Native autolinking - generates PackageList.java and adds native module dependencies
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

react {
    //
    // Added by install-expo-modules
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", rootDir.getAbsoluteFile().getParentFile().getAbsolutePath(), "android", "absolute"].execute(null, rootDir).text.trim())
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli')"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
}

def enableProguardInReleaseBuilds = true

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.drivelegal"
    defaultConfig {
        applicationId "com.drivelegal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    splits {
        abi {
            enable false
            reset()
            include "arm64-v8a"
            universalApk false
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            // Tells Chaquopy where to find Python modules
            python.srcDir "src/main/python"
        }
    }
    chaquopy {
        defaultConfig {
            if (System.getenv("GITHUB_ACTIONS") != null) {
                buildPython "python3"
            } else {
                buildPython "C:/Users/kille/AppData/Local/Programs/Python/Python311/python.exe"
            }
            pip {
                // Use unpinned numpy so Chaquopy auto-selects its pre-built Android wheel.
                // Pinning to 1.24.3 caused source compilation failure (no native C compiler).
                install "numpy"
            }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("com.google.android.gms:play-services-location:21.0.1")
    debugImplementation("com.facebook.react:flipper-integration")
}
