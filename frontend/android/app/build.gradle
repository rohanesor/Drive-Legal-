/**
 * Android app module build configuration
 * 
 * Key configurations:
 * - Applies Chaquopy plugin to embed Python runtime in the Android app
 * - Configures Python packages (faiss, onnxruntime, pywhispercpp)
 * - Sets up React Native autolinking
 * - Enables large heap for ML model memory requirements
 */
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.chaquo.python"

// React Native autolinking - generates PackageList.java and adds native module dependencies
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

react {
}

def enableProguardInReleaseBuilds = false

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.drivelegal"
    defaultConfig {
        applicationId "com.drivelegal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main {
            // Tells Chaquopy where to find Python modules
            python.srcDir "src/main/python"
        }
    }
    chaquopy {
        defaultConfig {
            buildPython "C:/Users/kille/AppData/Local/Programs/Python/Python311/python.exe"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("com.google.android.gms:play-services-location:21.0.1")
    debugImplementation("com.facebook.react:flipper-integration")
}
