name: DriveLegal AWS Deployment CI/CD

on:
  push:
    branches:
      - master

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Frontend Dependencies
        run: |
          npm install
          cd frontend && npm install

      - name: Run Jest Unit Verification Suite
        run: npm run test

      - name: Run TypeScript typecheck compiler check
        run: |
          npx tsc --noEmit
          cd frontend && npx tsc --noEmit

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy requests

      - name: Run Python Backend Unit Tests
        run: |
          python backend/src/run_tests.py

      - name: Run Build Verification Checks
        run: |
          python backend/src/verify_build.py

      - name: Setup Chaquopy Bundle Assets
        run: |
          python backend/src/setup_build.py

      - name: Build Android Unsigned Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Calculate APK SHA-256 Checksum
        run: |
          sha256sum frontend/android/app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1 > checksum.txt
          echo "APK SHA-256 Checksum is: $(cat checksum.txt)"

      - name: Update Latest Release Manifest
        run: |
          python -c "
          import json
          with open('checksum.txt', 'r') as f:
              sha = f.read().strip()
          with open('backend/src/static/latest.json', 'r') as f:
              data = json.load(f)
          data['android']['sha256'] = sha
          with open('backend/src/static/latest.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Upload APK and Manifest Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build-assets
          path: |
            frontend/android/app/build/outputs/apk/debug/app-debug.apk
            backend/src/static/latest.json
            backend/src/static/releases.json

  deploy:
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-build-assets

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Copy Build Artifacts to EC2 static files folder
        run: |
          # Create static folders on the EC2 host if they don't exist
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_SSH_HOST }} "mkdir -p /home/ubuntu/DriveLegal/backend/src/static/files"
          
          # Copy APK to the versioned static files directory
          scp -o StrictHostKeyChecking=no frontend/android/app/build/outputs/apk/debug/app-debug.apk ubuntu@${{ secrets.EC2_SSH_HOST }}:/home/ubuntu/DriveLegal/backend/src/static/files/DriveLegal-v1.0.0.apk
          
          # Copy Manifests to the static directory
          scp -o StrictHostKeyChecking=no backend/src/static/latest.json ubuntu@${{ secrets.EC2_SSH_HOST }}:/home/ubuntu/DriveLegal/backend/src/static/latest.json
          scp -o StrictHostKeyChecking=no backend/src/static/releases.json ubuntu@${{ secrets.EC2_SSH_HOST }}:/home/ubuntu/DriveLegal/backend/src/static/releases.json

      - name: Deploy to AWS EC2 via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_SSH_HOST }} << 'EOF'
            cd /home/ubuntu/DriveLegal
            
            # Fetch latest git commits
            git pull origin master
            
            # Load production environmental variables from SSM Parameter Store
            export DB_PASSWORD=$(aws ssm get-parameter --name "/drivelegal/prod/db_password" --with-decryption --query "Parameter.Value" --output text || echo "default_pass")
            
            # Rebuild and run containers
            docker compose -f backend/docker-compose.prod.yml down
            docker compose -f backend/docker-compose.prod.yml up -d --build
            
            # Smoke check health endpoint and verify download URL is online
            sleep 10
            curl -f http://localhost:8000/health || (echo "Deployment failed health checks. Reverting..." && docker compose -f backend/docker-compose.prod.yml rollback)
            
            # Verify download URL returns HTTP 200
            curl -f -I http://localhost:8000/download/files/DriveLegal-v1.0.0.apk || (echo "Deployment failed APK download check. Reverting..." && docker compose -f backend/docker-compose.prod.yml rollback)
          EOF
