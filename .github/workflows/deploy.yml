name: DriveLegal AWS Deployment CI/CD

on:
  push:
    branches:
      - master

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Frontend Dependencies
        run: |
          cd frontend && npm ci

      - name: Run TypeScript typecheck compiler check
        run: |
          cd frontend && npx tsc --noEmit

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests sentence-transformers faiss-cpu

      - name: Run Python Backend Unit & E2E Tests
        run: |
          PYTHONPATH=backend/src python backend/src/run_tests.py
          PYTHONPATH=backend/src python backend/src/tests/test_e2e_full_system.py

      - name: Log Build Metadata
        run: |
          echo "BUILDING DRIVELEGAL FROM:"
          pwd
          git rev-parse --short HEAD
          git branch --show-current
          echo "Package Version:"
          cat frontend/package.json | grep '"version"' || true
          echo "Application ID:"
          cat frontend/android/app/build.gradle | grep 'applicationId' || true
          echo "Version Name / Code:"
          cat frontend/android/app/build.gradle | grep 'versionName' || true
          cat frontend/android/app/build.gradle | grep 'versionCode' || true

      - name: Clean Stale APKs
        run: |
          find . -name "*.apk" -delete

      - name: Build Android Production Release APK and AAB
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew clean --no-daemon
          ./gradlew assembleRelease bundleRelease --no-daemon "-Psentry.autoUpload=false"

      - name: Verify Newly Generated APK
        run: |
          echo "Newly generated APKs:"
          find frontend/android -name "*.apk" -type f

      - name: Calculate Release Checksums
        run: |
          sha256sum frontend/android/app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1 > checksum.txt
          echo "APK SHA-256 Checksum: $(cat checksum.txt)"

      - name: Update Latest Release Manifest
        run: |
          python -c "
          import json
          with open('checksum.txt', 'r') as f:
              sha = f.read().strip()
          with open('backend/src/static/latest.json', 'r') as f:
              data = json.load(f)
          data['android']['sha256'] = sha
          with open('backend/src/static/latest.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-build-assets
          path: |
            frontend/android/app/build/outputs/apk/release/app-release.apk
            frontend/android/app/build/outputs/bundle/release/app-release.aab
            backend/src/static/latest.json
            backend/src/static/releases.json

  deploy:
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-build-assets
          path: .

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to AWS EC2 via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_SSH_HOST }} << 'EOF'
            cd /home/ubuntu/DriveLegal
            
            # Fetch latest git commits and force reset to origin master
            git fetch origin master
            git reset --hard origin/master
            
            # Load production environmental variables from SSM Parameter Store
            export DB_PASSWORD=$(aws ssm get-parameter --name "/drivelegal/prod/db_password" --with-decryption --query "Parameter.Value" --output text || echo "default_pass")
            
            # Rebuild and run containers
            docker compose -f backend/docker-compose.prod.yml down
            docker compose -f backend/docker-compose.prod.yml up -d --build
            
            # Smoke check health endpoint
            sleep 10
            curl -f http://localhost:8000/health || (echo "Deployment failed health checks." && exit 1)
          EOF

      - name: Copy Build Artifacts to EC2 static files folder
        run: |
          # Create static folders on the EC2 host if they don't exist
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_SSH_HOST }} "mkdir -p /home/ubuntu/DriveLegal/backend/src/static/files"
          
          # Copy APK to the versioned static files directory
          scp -o StrictHostKeyChecking=no frontend/android/app/build/outputs/apk/release/app-release.apk ubuntu@${{ secrets.EC2_SSH_HOST }}:/home/ubuntu/DriveLegal/backend/src/static/files/DriveLegal-v1.0.0.apk
          
          # Copy Manifests to the static directory
          scp -o StrictHostKeyChecking=no backend/src/static/latest.json ubuntu@${{ secrets.EC2_SSH_HOST }}:/home/ubuntu/DriveLegal/backend/src/static/latest.json
          scp -o StrictHostKeyChecking=no backend/src/static/releases.json ubuntu@${{ secrets.EC2_SSH_HOST }}:/home/ubuntu/DriveLegal/backend/src/static/releases.json

      - name: Run Live Verification and Smoke Tests
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_SSH_HOST }} << 'EOF'
            # Smoke check health endpoint and verify download URL is online
            curl -f http://localhost:8000/health || (echo "Verification failed: API server unhealthy" && exit 1)
            
            # Verify download URL returns HTTP 200
            curl -f -I http://localhost:8000/download/files/DriveLegal-v1.0.0.apk || (echo "Verification failed: APK file download check failed" && exit 1)
            
            # Verify latest release JSON manifest returns HTTP 200
            curl -f http://localhost:8000/releases/latest.json || (echo "Verification failed: Latest release manifest unreachable" && exit 1)
          EOF
